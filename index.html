<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Чайна карта Юньнані</title>
  <meta name="description" content="Інтерактивна карта чайних регіонів Юньнані українською мовою.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Чайна карта Юньнані</h1>
    <p>Гірські райони, села та чайні регіони пуеру</p>
  </div>
  <button id="listButton" class="mobile-button" aria-label="Відкрити список">☰</button>
</header>

<main class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Пошук: Іу, 易武, Yiwu..." autocomplete="off">
    </div>
    <div class="hint">Натисніть на точку на карті або виберіть локацію зі списку.</div>
    <div id="locations" class="locations"></div>
  </aside>
  <section class="map-wrap">
    <div id="map"></div>
    <div id="legend" class="legend">
      <strong>Юньнань</strong>
      <span>● чайна локація</span>
    </div>
  </section>
</main>

<div id="detail" class="detail hidden">
  <button id="closeDetail" class="close" aria-label="Закрити">×</button>
  <div id="detailContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
</body>
</html>
